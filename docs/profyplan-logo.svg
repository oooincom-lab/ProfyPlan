<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- БЛОК 1 (верхний задний, синий) — самый тёмный -->
      <polygon points="50,10 22,28 22,46 50,64" fill="#02101E" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="50,10 78,28 78,46 50,64" fill="#041830" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="50,10 78,28 50,46 22,28" fill="#082040" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>

      <!-- БЛОК 2 (нижний-левый, голубой) — светлее верхнего -->
      <polygon points="30,38 2,56 2,74 30,92" fill="#041830" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="30,38 58,56 58,74 30,92" fill="#082040" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="30,38 58,56 30,74 2,56" fill="#0E3060" stroke="#93C5FD" stroke-width="2" stroke-linejoin="round"/>

      <!-- БЛОК 3 (правый, янтарный) — над всеми -->
      <polygon points="70,38 42,56 42,74 70,92" fill="#0D0700" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="70,38 98,56 98,74 70,92" fill="#1A0E00" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="70,38 98,56 70,74 42,56" fill="#2F1A00" stroke="#FCD34D" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="70,56 98,74 70,92 42,74" fill="#0A0500" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,3" opacity="0.3"/>

      <!-- 3 УЗЛА -->
      <circle cx="50" cy="28" r="5" fill="white" stroke="#60A5FA" stroke-width="2.5"/>
      <circle cx="70" cy="56" r="5" fill="white" stroke="#FCD34D" stroke-width="2.5"/>
      <circle cx="30" cy="56" r="5" fill="white" stroke="#93C5FD" stroke-width="2.5"/>

      <!-- CPM ПУТЬ: верхний → левый → правый -->
      <line x1="50" y1="28" x2="30" y2="56" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="56" x2="70" y2="56" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <polygon points="33,50 30,56 33,62" fill="#F59E0B"/>
      <polygon points="67,50 70,56 67,62" fill="#F59E0B"/>
    </svg>