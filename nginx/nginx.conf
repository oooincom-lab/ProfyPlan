# /etc/nginx/nginx.conf � ProfyPlan reverse proxy
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Внутренний DNS Docker (127.0.0.11). Без него имена сервисов (web, api)
    # разрешаются один раз при старте прокси и держатся в памяти; после
    # пересоздания контейнеров их внутренние адреса меняются — и всё
    # проксируемое начинает отдавать 502. С «resolver» и переменной в
    # proxy_pass имя переразрешается, срок жизни записи — 10 секунд.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Landing page: profyplan.ru (HTTP)
    server {
        listen 80;
        server_name profyplan.ru www.profyplan.ru;

        root /usr/share/nginx/landing;
        index landing.html;


        # Static pages
location = / {
            root /usr/share/nginx/landing;
            try_files /landing.html =404;
        }

        location / {
            set $up_web http://web:3000;
            proxy_pass $up_web$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /health {
            return 200 "OK";
        }

        location /api/ {
            set $up_api http://api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $up_api$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Landing page: profyplan.ru (HTTPS � for Cloudflare Full/Strict mode)
    server {
        listen 443 ssl;
        server_name profyplan.ru www.profyplan.ru;

        ssl_certificate /etc/nginx/ssl/profyplan.crt;
        ssl_certificate_key /etc/nginx/ssl/profyplan.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;


        # Static pages
location = / {
            root /usr/share/nginx/landing;
            try_files /landing.html =404;
        }

        location / {
            set $up_web http://web:3000;
            proxy_pass $up_web$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /health {
            return 200 "OK";
        }

        location /api/ {
            set $up_api http://api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $up_api$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # API backend
    server {
        listen 80;
        server_name api.profyplan.ru;


        # Static pages
location / {
            set $up_api http://api:8000;
            proxy_pass $up_api$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    # Healthcheck-only minimal server
    server {
        listen 80 default_server;

        location /api/ {
            set $up_api http://api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $up_api$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


        # Static pages
location / {
            return 200 "ProfyPlan Gateway OK";
        }
    }
}
