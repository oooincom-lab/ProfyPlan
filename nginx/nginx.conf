# /etc/nginx/nginx.conf — ProfyPlan reverse proxy
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Landing page: profyplan.ru (HTTP)
    server {
        listen 80;
        server_name profyplan.ru www.profyplan.ru;

        root /usr/share/nginx/landing;
        index landing.html;

        location / {
            try_files $uri $uri/ /landing.html;
        }

        location = /health {
            return 200 "OK";
        }

        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Landing page: profyplan.ru (HTTPS — for Cloudflare Full/Strict mode)
    server {
        listen 443 ssl;
        server_name profyplan.ru www.profyplan.ru;

        ssl_certificate /etc/nginx/ssl/profyplan.crt;
        ssl_certificate_key /etc/nginx/ssl/profyplan.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/landing;
        index landing.html;

        location / {
            try_files $uri $uri/ /landing.html;
        }

        location = /health {
            return 200 "OK";
        }

        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # API backend
    server {
        listen 80;
        server_name api.profyplan.ru;

        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    # Healthcheck-only minimal server
    server {
        listen 80 default_server;

        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 200 "ProfyPlan Gateway OK";
        }
    }
}
