<!DOCTYPE html>
<html lang="ru">

<title>ProfyPlan — Сетевой график (Вариант 2: дни на связях + Старт/Финиш)</title>
<style>
  :root {
    --bg: #0A1628; --bg-2: #0F1E36; --bg-3: #162844;
    --fg: #E8EEF5; --fg-2: #B0C4DE; --fg-3: #8FA3BD; --fg-4: #5A7090;

  .topbar {
    padding: 12px 20px; background: var(--bg-2); border-bottom: 1px solid var(--border);

  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent-3);
    background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.2);
    padding: 2px 8px; border-radius: 100px; white-space: nowrap;
  }
  .mode-tabs { display: flex; gap: 0; border-radius: 7px; overflow: hidden; border: 1px solid var(--border); }
  .mode-btn {
    padding: 4px 10px; font-size: 11px; font-weight: 600; border: none; cursor: pointer;
    background: transparent; color: var(--fg-3); font-family: inherit; transition: all 0.12s; white-space: nowrap;
  }
  .mode-btn:hover { color: var(--fg); }
  .mode-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; box-shadow: 0 2px 8px rgba(59,130,246,0.35); }
  .legend { display: flex; gap: 12px; font-size: 10px; color: var(--fg-4); align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; }
  .btn {
    font-family: inherit; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: all 0.12s;
    background: transparent; color: var(--fg-3); border-color: var(--border); white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-3); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border: none; box-shadow: 0 2px 8px rgba(59,130,246,0.35); }

  .canvas-wrap { position: relative; width: 100%; height: calc(100vh - 53px); overflow: hidden; cursor: grab; }
  .canvas-wrap.panning { cursor: grabbing; }
  .canvas-wrap.dragging { cursor: grabbing; }

  .tooltip {
    position: absolute; background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; pointer-events: none; opacity: 0; transition: opacity 0.1s;
    min-width: 240px; color: var(--fg); font-size: 13px; z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .tooltip.on { opacity: 1; }
  .tooltip-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .tooltip-row { display: flex; justify-content: space-between; padding: 2px 0; color: var(--fg-3); font-size: 12px; }
  .tooltip-row b { font-family: 'IBM Plex Mono', monospace; color: var(--fg); font-weight: 600; }
  .info-panel {
    position: absolute; bottom: 16px; left: 16px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 11px; color: var(--fg-3); pointer-events: none; z-index: 5;
  }
  .info-panel strong { color: var(--fg); }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <h1>Сетевой график</h1>
    <span class="badge">PCB-1421 &middot; CPM</span>
  </div>
  <div class="mode-tabs" id="modeTabs">
    <button class="mode-btn active" data-mode="absolute">Абсолютный</button>
    <button class="mode-btn" data-mode="relative">Относительный</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="border-color:var(--danger);background:rgba(239,68,68,0.18);box-shadow:0 0 8px rgba(239,68,68,0.5);"></div> Критический</div>

</div>

    <span style="color:var(--fg-4);margin-top:2px;display:inline-block;">Drag &middot; Scroll &middot; <span id="modeLabel">Режим: Абсолютный</span></span>
  </div>
</div>
<script>
var NODE_R = 26, MIN_NODE_GAP = 60, REL_SCALE = 20;
function getNodeR() { var r = NODE_R * (0.72 / Math.max(scale, 0.35)); return Math.min(Math.max(r, 22), 40); }

var ops = [
  { id:"S",  num:'S',  name:"\u0421\u0442\u0430\u0440\u0442",     dur:0,  unit:'d', es:0,  ef:0,  ls:0,  lf:0,  tf:0,  crit:1 },
  { id:"1",  num:1,  name:"\u041f\u043e\u0434\u0433\u043e\u0442\u043e\u0432\u043a\u0430 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u0441\u0442\u0432\u0430", dur:3,  unit:'d', es:0,  ef:3,  ls:0,  lf:3,  tf:0,  crit:1 },
  { id:"2",  num:2,  name:"\u0417\u0430\u043a\u0443\u043f\u043a\u0430 \u043a\u043e\u043c\u043f\u043e\u043d\u0435\u043d\u0442\u043e\u0432",     dur:8,  unit:'d', es:3,  ef:11, ls:3,  lf:11, tf:0,  crit:1 },
  { id:"3",  num:3,  name:"\u0412\u0445\u043e\u0434\u043d\u043e\u0439 \u043a\u043e\u043d\u0442\u0440\u043e\u043b\u044c",        dur:2,  unit:'d', es:11, ef:13, ls:11, lf:13, tf:0,  crit:1 },
  { id:"4",  num:4,  name:"\u0422\u0435\u0440\u043c\u043e\u043f\u0440\u043e\u0444\u0438\u043b\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435", dur:1,  unit:'h', es:11, ef:12, ls:12, lf:13, tf:1,  crit:0 },
  { id:"5",  num:5,  name:"\u041c\u043e\u043d\u0442\u0430\u0436 SMD",              dur:12, unit:'d', es:13, ef:25, ls:13, lf:25, tf:0,  crit:1 },
  { id:"6",  num:6,  name:"\u041c\u043e\u043d\u0442\u0430\u0436 DIP",              dur:4,  unit:'d', es:13, ef:17, ls:21, lf:25, tf:8,  crit:0 },
  { id:"7",  num:7,  name:"\u041f\u0430\u0439\u043a\u0430 \u0432\u043e\u043b\u043d\u043e\u0439",            dur:6,  unit:'d', es:25, ef:31, ls:25, lf:31, tf:0,  crit:1 },
  { id:"8",  num:8,  name:"\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0430 \u0440\u0430\u0437\u044a\u0451\u043c\u043e\u0432",      dur:5,  unit:'d', es:31, ef:36, ls:31, lf:36, tf:0,  crit:1 },
  { id:"9",  num:9,  name:"\u041a\u043e\u043d\u0442\u0440\u043e\u043b\u044c \u043f\u0430\u0439\u043a\u0438 (AOI)",    dur:3,  unit:'d', es:36, ef:39, ls:36, lf:39, tf:0,  crit:1 },
  { id:"10", num:10, name:"\u0424\u0443\u043d\u043a\u0446\u0438\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0439 \u0442\u0435\u0441\u0442",     dur:8,  unit:'d', es:39, ef:47, ls:39, lf:47, tf:0,  crit:1 },
  { id:"11", num:11, name:"\u0422\u0435\u0440\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u0440\u043e\u0432\u043a\u0430",         dur:12, unit:'d', es:47, ef:59, ls:47, lf:59, tf:0,  crit:1 },
  { id:"12", num:12, name:"\u0412\u044b\u0445\u043e\u0434\u043d\u043e\u0439 \u043a\u043e\u043d\u0442\u0440\u043e\u043b\u044c",       dur:3,  unit:'d', es:59, ef:62, ls:59, lf:62, tf:0,  crit:1 },
  { id:"13", num:13, name:"\u041c\u0430\u0440\u043a\u0438\u0440\u043e\u0432\u043a\u0430",              dur:2,  unit:'d', es:62, ef:64, ls:62, lf:64, tf:0,  crit:1 },
  { id:"14", num:14, name:"\u0423\u043f\u0430\u043a\u043e\u0432\u043a\u0430",                dur:2,  unit:'d', es:62, ef:64, ls:62, lf:64, tf:0,  crit:0 },
  { id:"F",  num:'F',  name:"\u0424\u0438\u043d\u0438\u0448",     dur:0,  unit:'d', es:64, ef:64, ls:64, lf:64, tf:0, crit:1 },
];
var om = {}; for(var i=0;i<ops.length;i++) om[ops[i].id]=ops[i];

var deps = [
  ["S","1"],["1","2"],["2","3"],["3","5"],["5","7"],["7","8"],["8","9"],
  ["9","10"],["10","11"],["11","12"],["12","13"],["13","F"],
  ["2","4"],["4","5"],["3","6"],["6","7"],["12","14"],["14","F"]
];

var PROJECT_START = new Date(2026, 6, 29);
var viewMode = 'absolute';

var UNITS={s:'\u0441\u0435\u043a',m:'\u043c\u0438\u043d',h:'\u0447',d:'\u0434\u043d',w:'\u043d\u0435\u0434',mo:'\u043c\u0435\u0441',y:'\u0433\u043e\u0434'};function fmtDur(dur,unit){if(!unit)unit='d';if(dur<=0)return'-';return dur+' '+(UNITS[unit]||unit);}

// Russian holidays 2026 + weekends (Sat/Sun)
var HOLIDAYS_2026=new Set([
  '2026-01-01','2026-01-02','2026-01-03','2026-01-04','2026-01-05','2026-01-06','2026-01-07','2026-01-08',
  '2026-02-23','2026-03-08','2026-05-01','2026-05-09','2026-06-12','2026-11-04'
]);
function isWeekend(d){var dow=d.getDay();return dow===0||dow===6;}
function isHoliday(d){var s=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);return HOLIDAYS_2026.has(s);}

function buildAbsoluteLayout() {
  var LANE_ABOVE=170,LANE_BELOW=390,LANE_DEFAULT=340;
  var layers={}; for(var i=0;i<ops.length;i++){var k=ops[i].es;if(!layers[k])layers[k]=[];layers[k].push(ops[i].id);}
  var layerOrder=Object.keys(layers).map(Number).sort(function(a,b){return a-b;});
  var layout={};
  for(var li=0;li<layerOrder.length;li++){
    var lx=30+li*150,ids=layers[layerOrder[li]];
    var startY=340-((ids.length-1)*NODE_R*3.2)/2;
    for(var i=0;i<ids.length;i++) layout[ids[i]]=[lx,startY+i*NODE_R*3.2];
  }
  spreadLayerVertically(layout);
  resolveCrossings(layout,[LANE_ABOVE,LANE_BELOW]);
  return layout;
}
function buildRelativeLayout() {
  var layout={},layers={};
  for(var i=0;i<ops.length;i++){var k=ops[i].es;if(!layers[k])layers[k]=[];layers[k].push(ops[i].id);}
  var layerOrder=Object.keys(layers).map(Number).sort(function(a,b){return a-b;});
  for(var li=0;li<layerOrder.length;li++){
    var es=layerOrder[li],lx=30+es*REL_SCALE,ids=layers[es];
    var startY=340-((ids.length-1)*NODE_R*3.2)/2;
    for(var i=0;i<ids.length;i++) layout[ids[i]]=[lx,startY+i*NODE_R*3.2];
  }
  for(var li=1;li<layerOrder.length;li++){
    var prevEs=layerOrder[li-1],curEs=layerOrder[li];
    var prevX=layout[layers[prevEs][0]][0],curX=layout[layers[curEs][0]][0];
    if(curX-prevX<MIN_NODE_GAP){var delta=MIN_NODE_GAP-(curX-prevX);for(var i=0;i<layers[curEs].length;i++)layout[layers[curEs][i]][0]+=delta;}
  }
  spreadLayerVertically(layout);
  resolveCrossings(layout,[140,200,260,320,380,440,500]);
  return layout;
}
function resolveCrossings(layout,alts){
  var placed=[];
  for(var ei=0;ei<deps.length;ei++){
    var a=deps[ei][0],b=deps[ei][1],pa=layout[a],pb=layout[b];
    if(!pa||!pb)continue;
    if(!crossesAny([a,b],layout,placed)){placed.push(edgeToSeg(a,b,layout));continue;}
    var oldY=pb[1],found=false;
    for(var ai=0;ai<alts.length;ai++){if(alts[ai]===oldY)continue;pb[1]=alts[ai];if(!nodeOverlap(b,layout,a)&&!crossesAny([a,b],layout,placed)){found=true;break;}}
    if(!found)pb[1]=oldY;
    placed.push(edgeToSeg(a,b,layout));
  }
}
function segCross(s1,s2){var ax=s1.ax,ay=s1.ay,bx=s1.bx,by=s1.by,cx=s2.ax,cy=s2.ay,dx=s2.bx,dy=s2.by;var d1=(dx-cx)*(ay-cy)-(dy-cy)*(ax-cx),d2=(dx-cx)*(by-cy)-(dy-cy)*(bx-cx),d3=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax),d4=(bx-ax)*(dy-ay)-(by-ay)*(dx-ax);return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));}
function edgeToSeg(a,b,lo){var pa=lo[a],pb=lo[b],ang=Math.atan2(pb[1]-pa[1],pb[0]-pa[0]);return {ax:pa[0]+Math.cos(ang)*NODE_R,ay:pa[1]+Math.sin(ang)*NODE_R,bx:pb[0]-Math.cos(ang)*NODE_R,by:pb[1]-Math.sin(ang)*NODE_R};}
function crossesAny(key,lo,placed){var s=edgeToSeg(key[0],key[1],lo);for(var i=0;i<placed.length;i++)if(segCross(s,placed[i]))return true;return false;}
function nodeOverlap(nid,lo,ex){var TA=24,TB=20,pn=lo[nid];if(!pn)return false;var ids=Object.keys(lo);for(var i=0;i<ids.length;i++){var oid=ids[i];if(oid===nid||oid===ex)continue;var po=lo[oid],hg=Math.abs(pn[0]-po[0]);if(hg>NODE_R*3)continue;var sT=pn[1]-NODE_R-TA,sB=pn[1]+NODE_R+TB,oT=po[1]-NODE_R-TA,oB=po[1]+NODE_R+TB;if(sT<oB&&sB>oT)return true;}return false;}

function spreadLayerVertically(layout){
  var TA=24;
  var byX={};var ids=Object.keys(layout).sort(function(a,b){return layout[a][0]-layout[b][0];});
  for(var i=0;i<ids.length;i++){var oid=ids[i];if(!byX[layout[oid][0]])byX[layout[oid][0]]=[];byX[layout[oid][0]].push(oid);}
  var sortedX=Object.keys(byX).map(Number).sort(function(a,b){return a-b;});
  // Within each layer
  for(var xi=0;xi<sortedX.length;xi++){
    var x=sortedX[xi],list=byX[x];if(list.length<2)continue;
    for(var i=1;i<list.length;i++){
      var prev=layout[list[i-1]],cur=layout[list[i]];
      var prevTop=prev[1]-NODE_R-TA,curTop=cur[1]-NODE_R-TA,gap=curTop-prevTop;
      if(gap<14){var shift=14-gap;layout[list[i]][1]+=shift;for(var j=i+1;j<list.length;j++)layout[list[j]][1]+=shift;}
    }
  }
  // Between adjacent layers: check all pairs where |dx| < 100
  for(var i=0;i<ids.length;i++){
    for(var j=i+1;j<ids.length;j++){
      var a=ids[i],b=ids[j],pa=layout[a],pb=layout[b];
      var dx=Math.abs(pa[0]-pb[0]);if(dx>100)continue;
      var aTop=pa[1]-NODE_R-TA,bTop=pb[1]-NODE_R-TA;
      if(Math.abs(aTop-bTop)<16&&dx<100){pb[1]+=(16-Math.abs(aTop-bTop))*((pb[1]>=pa[1])?1:-1);}
    }
  }
}

var absLayout=buildAbsoluteLayout(),relLayout=buildRelativeLayout();
function clone(src){var o={};for(var k in src)o[k]=[src[k][0],src[k][1]];return o;}
var pos=clone(absLayout);

var scale,ox,oy;
function fitToScreen(){
  var W=window.innerWidth,H=window.innerHeight-53;
  scale = (W*0.82)/1500;
  if(scale<0.22)scale=0.22;if(scale>1.5)scale=1.5;
  ox=(W/scale-1500)/2;
  oy=(H/scale-460)/2-20;if(oy<-40)oy=-40;
}
fitToScreen();

function addDays(d,days){var r=new Date(d);r.setDate(r.getDate()+days);return r;}
function fmt(d){return (d.getDate()<10?'0':'')+d.getDate()+'.'+(d.getMonth()<9?'0':'')+(d.getMonth()+1);}

var panning=false,psx,psy,pox,poy,dragId=null,dragPos0,dragM0,critOnly=false,hoverId=null;
var c=document.getElementById('c'),ctx=c.getContext('2d');
var wrap=document.getElementById('wrap'),tip=document.getElementById('tip');

function sx(wx){return(wx+ox)*scale;}
function sy(wy){return(wy+oy)*scale;}
function hit(cx,cy,mx,my,id){var nr=getNodeR();if(id==='S'){var hs=nr+8;var dx=Math.abs(mx-cx)/(hs*0.75),dy=Math.abs(my-cy)/hs;return dx+dy<=1;}if(id==='F'){var ss=nr*1.0;return mx>=cx-ss*scale&&mx<=cx+ss*scale&&my>=cy-ss*scale&&my<=cy+ss*scale;}var rr=(nr*scale);return(mx-cx)*(mx-cx)+(my-cy)*(my-cy)<=rr*rr;}

function drawTimelineGrid(W,H){
  var totalDays=64,startX=30,endX=startX+totalDays*REL_SCALE;
  var dayPx=REL_SCALE*scale; // pixels per day at current scale
  // Compute primary grid step so lines are ~60-140px apart
  var pStep=1;
  if(dayPx>400)pStep=0.125; // ~3h
  else if(dayPx>200)pStep=0.25; // 6h
  else if(dayPx>100)pStep=0.5; // 12h
  else if(dayPx>55)pStep=1; // 1 day
  else if(dayPx>22)pStep=2;
  else if(dayPx>11)pStep=4;
  else if(dayPx>5)pStep=7;
  else if(dayPx>2.5)pStep=14;
  else if(dayPx>1)pStep=30;
  else pStep=90;
  // Sub-grid: finer lines at 1/4 the primary step for reference
  var sStep=pStep/4;
  if(pStep<1 && sStep<0.03125)sStep=0;

  var gridVTop=0,gridVBot=H;
  // Weekend/holiday highlighting — full-height strips
  for(var d=0;d<totalDays;d++){
    var date=addDays(PROJECT_START,d);
    if(isWeekend(date)||isHoliday(date)){
      var x1=sx(startX+d*REL_SCALE),x2=sx(startX+(d+1)*REL_SCALE);
      if(x2<0||x1>W)continue;
      ctx.fillStyle='rgba(239,68,68,0.04)';
      ctx.fillRect(Math.max(0,x1),gridVTop,Math.min(W,x2-x1),H);
    }
  }
  // Sub-grid: faint lines
  if(sStep>0){
    for(var d=0;d<=totalDays;d+=sStep){
      var gx=sx(startX+d*REL_SCALE);if(gx<-50||gx>W+50)continue;
      ctx.beginPath();ctx.moveTo(gx,gridVTop);ctx.lineTo(gx,gridVBot);
      ctx.strokeStyle='rgba(60,90,130,0.15)';ctx.lineWidth=0.3;ctx.stroke();
    }
  }
  // Primary grid: bold lines
  for(var d=0;d<=totalDays;d+=pStep){
    var gx=sx(startX+d*REL_SCALE);if(gx<-50||gx>W+50)continue;
    ctx.beginPath();ctx.moveTo(gx,gridVTop);ctx.lineTo(gx,gridVBot);
    ctx.strokeStyle='rgba(60,90,130,0.5)';ctx.lineWidth=0.7;ctx.stroke();
  }
  var barY=34,barH=22,lsx=sx(startX),rsx=sx(endX);
  ctx.fillStyle='rgba(15,30,54,0.7)';ctx.beginPath();
  ctx.roundRect(Math.max(0,lsx-8),barY,Math.min(W,rsx-lsx+16),barH,6);ctx.fill();
  ctx.beginPath();ctx.moveTo(Math.max(0,lsx),barY+barH/2);ctx.lineTo(Math.min(W,rsx),barY+barH/2);
  ctx.strokeStyle='rgba(96,165,250,0.35)';ctx.lineWidth=1;ctx.stroke();
  var prevLR=-999;
  for(var d=0;d<=totalDays;d+=pStep){
    var gx=sx(startX+d*REL_SCALE);if(gx<-20||gx>W+20)continue;
    ctx.beginPath();ctx.moveTo(gx,barY+3);ctx.lineTo(gx,barY+barH-3);
    ctx.strokeStyle='rgba(90,112,144,0.5)';ctx.lineWidth=0.8;ctx.stroke();
    var label,isTime=false;
    if(pStep<1){
      // Sub-day: show time HH:MM
      isTime=true;
      var totalHours=d*24;
      var h=Math.floor(totalHours)%24,m=Math.round((totalHours-Math.floor(totalHours))*60);
      if(m===60){h++;m=0;if(h===24)h=0;}
      label=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;
    }else{
      var dd=Math.floor(d);var date=addDays(PROJECT_START,dd);
      label=fmt(date);
      if(pStep>=30){label+=' '+(date.getFullYear());}
    }
    // Font scales with zoom, but has min/max for readability
    var fsz=Math.round(isTime?11*scale:10*scale);
    if(fsz<8)fsz=8;if(fsz>14)fsz=14;
    ctx.fillStyle=isTime?'rgba(96,165,250,0.8)':'#B0C4DE';
    ctx.font=(isTime?'bold ':'')+fsz+'px "IBM Plex Mono",monospace';
    ctx.textAlign='center';ctx.textBaseline='top';
    var lw=ctx.measureText(label).width;
    if(gx-lw/2>prevLR){ctx.fillText(label,gx,barY+barH+4);prevLR=gx+lw/2;}
  }
}

function draw(){
  var W=wrap.clientWidth,H=wrap.clientHeight;
  c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.fillStyle='#0A1628';ctx.fillRect(0,0,W,H);
  if(viewMode==='relative') drawTimelineGrid(W,H);
  var vis=critOnly?ops.filter(function(o){return o.crit;}):ops;
  var vs={};for(var i=0;i<vis.length;i++)vs[vis[i].id]=true;
  // Position S next to first op, F next to last op
  if(pos['S']&&pos[ops[1].id]){var refPos=pos[ops[1].id];pos['S']=[refPos[0]-NODE_R*2.8,refPos[1]];}
  if(pos['F']&&pos[ops[ops.length-2].id]){var refPos2=pos[ops[ops.length-2].id];pos['F']=[refPos2[0]+NODE_R*2.8,refPos2[1]];}
  for(var i=0;i<deps.length;i++){
    var a=deps[i][0],b=deps[i][1];if(!vs[a]||!vs[b])continue;
    var fa=om[a],fb=om[b],pa=pos[a],pb=pos[b],ang=Math.atan2(pb[1]-pa[1],pb[0]-pa[0]),nr=getNodeR();
    var ax=pa[0]+Math.cos(ang)*nr,ay=pa[1]+Math.sin(ang)*nr,bx=pb[0]-Math.cos(ang)*nr,by=pb[1]-Math.sin(ang)*nr;
    var both=(fa&&fb)?(fa.crit&&fb.crit):false;
    ctx.beginPath();ctx.moveTo(sx(ax),sy(ay));ctx.lineTo(sx(bx),sy(by));
    ctx.strokeStyle=both?'rgba(239,68,68,0.35)':'rgba(96,165,250,0.30)';ctx.lineWidth=both?1.8:1.2;ctx.stroke();
    // Arrowhead
    var ang2=Math.atan2(sy(by)-sy(ay),sx(bx)-sx(ax)),hl=8;
    ctx.beginPath();ctx.moveTo(sx(bx),sy(by));
    ctx.lineTo(sx(bx)-hl*Math.cos(ang2-0.45),sy(by)-hl*Math.sin(ang2-0.45));
    ctx.lineTo(sx(bx)-hl*Math.cos(ang2+0.45),sy(by)-hl*Math.sin(ang2+0.45));ctx.closePath();
    ctx.fillStyle=both?'rgba(239,68,68,0.45)':'rgba(96,165,250,0.4)';ctx.fill();
    // Duration label on edge midpoint
    if(fa&&fa.dur>0){
      var midX=(ax+bx)/2,midY=(ay+by)/2,perpAng=ang+Math.PI/2;
      var loff=10, mx=midX+Math.cos(perpAng)*loff,my=midY+Math.sin(perpAng)*loff;
      ctx.save();ctx.fillStyle=both?'rgba(239,68,68,0.9)':'rgba(176,196,222,0.9)';
      ctx.font='bold '+Math.round(10*scale)+'px "IBM Plex Mono",monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      // Background pill
      var lbl=fmtDur(fa.dur,fa.unit);
      var txtW=ctx.measureText(lbl).width+8,txtH=Math.round(10*scale)+6;
      ctx.globalAlpha=0.75;ctx.fillStyle=both?'rgba(10,22,40,0.6)':'#0A1628';
      ctx.beginPath();ctx.roundRect(sx(mx)-txtW/2,sy(my)-txtH/2,txtW,txtH,3);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle=both?'rgba(239,68,68,1)':'rgba(176,196,222,0.9)';
      ctx.fillText(fmtDur(fa.dur,fa.unit),sx(mx),sy(my));
      ctx.restore();
    }
  }
  for(var i=0;i<vis.length;i++){
    var o=vis[i],cx=sx(pos[o.id][0]),cy=sy(pos[o.id][1]),nr=getNodeR(),r=nr*scale;
    // Start — green diamond, Finish — purple square
    if(o.id==='S'||o.id==='F'){
      if(o.id==='S'){
        // Green diamond — placed to the left of first real node
        var refPos=pos[ops[1].id]; // operation 1
        var sx2=refPos[0]-NODE_R*2.8,sy2=refPos[1]; // left offset
        pos['S']=[sx2,sy2]; // update layout
        cx=sx(sx2);cy=sy(sy2);
        var hs=r+8; ctx.beginPath();ctx.moveTo(cx,cy-hs);ctx.lineTo(cx+hs*0.75,cy);ctx.lineTo(cx,cy+hs);ctx.lineTo(cx-hs*0.75,cy);ctx.closePath();
        ctx.fillStyle='rgba(16,185,129,0.15)';ctx.fill();
        ctx.strokeStyle='rgba(16,185,129,0.6)';ctx.lineWidth=2;ctx.stroke();
        ctx.fillStyle='#10B981';ctx.font='bold '+Math.round(13*scale)+'px "IBM Plex Mono",monospace';
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('S', cx, cy);
        ctx.fillStyle='rgba(16,185,129,0.7)';ctx.font=Math.round(9*scale)+'px Inter,system-ui';ctx.textBaseline='bottom';
        ctx.fillText(o.name, cx, cy-hs-4);
      }else{
        // Purple square — smaller, placed to the right of last real node
        var lastOp=ops[ops.length-2]; // last real op before F
        var refPos2=pos[lastOp.id];
        var fx2=refPos2[0]+NODE_R*2.8,fy2=refPos2[1];
        pos['F']=[fx2,fy2];
        cx=sx(fx2);cy=sy(fy2);
        var ss=r*1.0; ctx.beginPath();ctx.rect(cx-ss,cy-ss,ss*2,ss*2);
        ctx.fillStyle='rgba(139,92,246,0.15)';ctx.fill();
        ctx.strokeStyle='rgba(139,92,246,0.6)';ctx.lineWidth=2;ctx.stroke();
        ctx.fillStyle='#8B5CF6';ctx.font='bold '+Math.round(12*scale)+'px "IBM Plex Mono",monospace';
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('F', cx, cy);
        ctx.fillStyle='rgba(139,92,246,0.7)';ctx.font=Math.round(9*scale)+'px Inter,system-ui';ctx.textBaseline='bottom';
        ctx.fillText(o.name, cx, cy-ss-4);
      }
      continue;
    }
    ctx.beginPath();ctx.arc(cx,cy,r+3,0,2*Math.PI);ctx.fillStyle=o.crit?'rgba(239,68,68,0.06)':'rgba(59,130,246,0.03)';ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.fillStyle=o.crit?'rgba(239,68,68,0.08)':'rgba(96,165,250,0.08)';ctx.fill();
    ctx.strokeStyle=o.crit?'rgba(239,68,68,0.5)':'rgba(96,165,250,0.55)';ctx.lineWidth=o.crit?2:1.5;ctx.stroke();
    ctx.fillStyle='#E8EEF5';ctx.font='bold '+Math.round(12*scale)+'px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.num,cx,cy);
    ctx.fillStyle=o.crit?'#E8EEF5':'rgba(176,196,222,0.7)';ctx.font=Math.round(10*scale)+'px Inter,system-ui';ctx.textBaseline='bottom';
    var sn=o.name;if(sn.length>16)sn=sn.slice(0,15)+'\u2026';ctx.fillText(sn,cx,cy-r-6);
    if(!o.crit&&o.tf>0){ctx.fillStyle='#F59E0B';ctx.font=Math.round(9*scale)+'px "IBM Plex Mono",monospace';ctx.textBaseline='top';ctx.fillText('+'+o.tf,cx,cy+r+4);}
  }
}

function switchMode(mode){
  viewMode=mode;absLayout=buildAbsoluteLayout();relLayout=buildRelativeLayout();
  pos=clone(mode==='absolute'?absLayout:relLayout);draw();
}

wrap.addEventListener('mousedown',function(e){
  var rect=wrap.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  var vis=critOnly?ops.filter(function(o){return o.crit;}):ops;
  for(var i=0;i<vis.length;i++){var o=vis[i],cx=sx(pos[o.id][0]),cy=sy(pos[o.id][1]);if(hit(cx,cy,mx,my,o.id)){dragId=o.id;dragPos0=[pos[o.id][0],pos[o.id][1]];dragM0=[mx,my];wrap.classList.add('dragging');return;}}
  panning=true;psx=mx;psy=my;pox=ox;poy=oy;wrap.classList.add('panning');
});
window.addEventListener('mousemove',function(e){
  var rect=wrap.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  if(dragId){var dx=(mx-dragM0[0])/scale,dy=(my-dragM0[1])/scale;pos[dragId][0]=dragPos0[0]+dx;pos[dragId][1]=dragPos0[1]+dy;draw();return;}
  if(panning){ox=pox+(mx-psx)/scale;oy=poy+(my-psy)/scale;draw();}
  var vis=critOnly?ops.filter(function(o){return o.crit;}):ops,found=null;
  for(var i=0;i<vis.length;i++){var o=vis[i],cx=sx(pos[o.id][0]),cy=sy(pos[o.id][1]);if(hit(cx,cy,mx,my,o.id)){found=o;break;}}
  if(found&&found.id!==hoverId){hoverId=found.id;
    tip.innerHTML='<div class="tooltip-title">\u2116'+found.num+' \u00b7 '+found.name+'</div>'
      +'<div class="tooltip-row">\u0414\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c <b>'+fmtDur(found.dur,found.unit)+'</b></div>'
      +'<div class="tooltip-row">ES <b>\u0434\u0435\u043d\u044c '+found.es+'</b></div><div class="tooltip-row">EF <b>\u0434\u0435\u043d\u044c '+found.ef+'</b></div>'
      +'<div class="tooltip-row">LS <b>\u0434\u0435\u043d\u044c '+found.ls+'</b></div><div class="tooltip-row">LF <b>\u0434\u0435\u043d\u044c '+found.lf+'</b></div>'
      +'<div class="tooltip-row">\u041f\u043e\u043b\u043d\u044b\u0439 \u0440\u0435\u0437\u0435\u0440\u0432 <b style="color:'+(found.crit?'var(--danger)':'var(--success)')+'">'+found.tf+' \u0434\u043d.</b></div>'
      +'<div class="tooltip-row" style="margin-top:4px;color:'+(found.crit?'var(--danger)':'var(--fg-4)')+';">'+(found.crit?'\u26a0 \u041a\u0440\u0438\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043f\u0443\u0442\u044c':'\u0421 \u0440\u0435\u0437\u0435\u0440\u0432\u043e\u043c')+'</div>';
    tip.classList.add('on');
  }else if(!found&&hoverId!==null){hoverId=null;tip.classList.remove('on');}
  if(found){var cx=sx(pos[found.id][0]),cy=sy(pos[found.id][1]),nr=getNodeR(),r=nr*scale;tip.style.left=Math.min(cx+r+14,window.innerWidth-280)+'px';tip.style.top=Math.max(4,cy-80)+'px';}
});
window.addEventListener('mouseup',function(){dragId=null;panning=false;wrap.classList.remove('dragging','panning');});
wrap.addEventListener('wheel',function(e){e.preventDefault();scale=Math.max(0.15,Math.min(2.5,scale*(e.deltaY<0?1.08:0.92)));draw();},{passive:false});
window.addEventListener('resize',function(){fitToScreen();draw();});

document.getElementById('btnReset').addEventListener('click',function(){absLayout=buildAbsoluteLayout();relLayout=buildRelativeLayout();pos=clone(viewMode==='absolute'?absLayout:relLayout);fitToScreen();draw();});
document.getElementById('btnCritical').addEventListener('click',function(){critOnly=!critOnly;draw();});
document.getElementById('modeTabs').addEventListener('click',function(e){
  var btn=e.target;if(!btn.classList.contains('mode-btn'))return;
  var mode=btn.getAttribute('data-mode');if(mode===viewMode)return;
  var btns=document.querySelectorAll('.mode-btn');for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');btn.classList.add('active');
  document.getElementById('modeLabel').innerText='\u0420\u0435\u0436\u0438\u043c: '+(mode==='absolute'?'\u0410\u0431\u0441\u043e\u043b\u044e\u0442\u043d\u044b\u0439':'\u041e\u0442\u043d\u043e\u0441\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0439');
  switchMode(mode);
});
draw();
</script>
</body>
</html>
