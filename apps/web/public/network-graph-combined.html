<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>ProfyPlan — Сводный сетевой график (Leveled)</title>
<style>
:root{--bg:#0A1628;--bg-2:#0F1E36;--bg-3:#162844;--fg:#E8EEF5;--fg-2:#B0C4DE;--fg-3:#8FA3BD;--fg-4:#5A7090;--border:#1E3252;--accent:#3B82F6;--accent-2:#2563EB;--accent-3:#60A5FA;--success:#10B981;--danger:#EF4444;--warning:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh;display:flex;flex-direction:column}
.topbar{padding:10px 20px;background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:center;z-index:10;flex-shrink:0;flex-wrap:wrap}
.topbar h1{font-size:15px;font-weight:700}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 10px;border-radius:100px;border:1px solid}
.badge-a{color:var(--accent-3);border-color:rgba(59,130,246,0.3);background:rgba(59,130,246,0.12)}
.badge-b{color:var(--success);border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.12)}
.badge-res{color:var(--warning);border-color:rgba(245,158,11,0.3);background:rgba(245,158,11,0.1)}
.canvas-wrap{flex:1;position:relative;overflow:hidden;cursor:grab}
.tooltip{position:absolute;background:var(--bg-3);border:1px solid var(--border);border-radius:10px;padding:12px 16px;pointer-events:none;opacity:0;transition:opacity .1s;min-width:240px;color:var(--fg);font-size:12px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tooltip.on{opacity:1}
.tooltip-title{font-weight:700;font-size:14px;margin-bottom:6px}
.tooltip-row{display:flex;justify-content:space-between;padding:1px 0;color:var(--fg-3);font-size:11px}
.tooltip-row b{font-family:'IBM Plex Mono',monospace;color:var(--fg);font-weight:600}
.info-panel{position:absolute;bottom:12px;left:12px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:10px;color:var(--fg-3);pointer-events:none;z-index:5;display:flex;gap:18px}
.legend-spot{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid}
</style>
</head>
<body>
<div class="topbar">
  <h1>Сводный график · Resource Leveling</h1>
  <span class="badge badge-a">Проект А · СибСтройМаш</span>
  <span class="badge badge-b">Проект Б · МеталлТех</span>
  <span class="badge badge-res">6 общих ресурсов</span>
  <span style="font-size:10px;color:var(--fg-4);margin-left:auto">═ логическая связь · ┈ ресурсная связь · Drag · Scroll</span>
</div>
<div class="canvas-wrap" id="wrap">
  <canvas id="c"></canvas>
  <div class="tooltip" id="tip"></div>
  <div class="info-panel">
    <div class="legend-spot"><div class="legend-dot" style="border-color:var(--accent-3);background:rgba(96,165,250,0.3)"></div> Проект А</div>
    <div class="legend-spot"><div class="legend-dot" style="border-color:var(--success);background:rgba(16,185,129,0.3)"></div> Проект Б</div>
    <div class="legend-spot"><div class="legend-dot" style="border-color:var(--danger);background:rgba(239,68,68,0.3)"></div> Крит. путь</div>
    <div class="legend-spot"><div class="legend-dot" style="border-color:var(--warning);background:rgba(245,158,11,0.15)"></div> Ресурсная</div>
  </div>
</div>
<script>
var NODE_R=26,PX_PER_H=50;
var resources=["CNC-01","WELD-01","PAINT-01","QC-STATION","TEST-BENCH","CALIB-RIG"];

// === DATA: two projects, leveled schedule ===
var opsA=[
  {id:"A1",num:1,name:"Подготовка",dur:4,unit:'h',es:0,ef:4,ls:0,lf:4,tf:0,crit:1,order:'A',res:'CNC-01'},
  {id:"A2",num:2,name:"Закупка",dur:8,unit:'h',es:4,ef:12,ls:4,lf:12,tf:0,crit:1,order:'A',res:'WELD-01'},
  {id:"A3",num:3,name:"Монтаж SMD",dur:8,unit:'h',es:12,ef:20,ls:12,lf:20,tf:0,crit:1,order:'A',res:'CNC-01'},
  {id:"A4",num:4,name:"Пайка",dur:6,unit:'h',es:20,ef:26,ls:20,lf:26,tf:0,crit:1,order:'A',res:'PAINT-01'},
  {id:"A5",num:5,name:"AOI",dur:0.25,unit:'h',es:26,ef:26.25,ls:26,lf:26.25,tf:0,crit:1,order:'A',res:'QC-STATION'},
  {id:"A6",num:6,name:"Функц.тест",dur:3,unit:'h',es:26.25,ef:29.25,ls:26.25,lf:29.25,tf:0,crit:1,order:'A',res:'TEST-BENCH'},
  {id:"A7",num:7,name:"Термотренир.",dur:12,unit:'h',es:29.25,ef:41.25,ls:29.25,lf:41.25,tf:0,crit:1,order:'A',res:'CNC-01'},
  {id:"A8",num:8,name:"Калибровка",dur:1,unit:'h',es:20,ef:21,ls:40.25,lf:41.25,tf:20.25,crit:0,order:'A',res:'CALIB-RIG'},
  {id:"A9",num:9,name:"Вых.контроль",dur:0.5,unit:'h',es:41.25,ef:41.75,ls:41.25,lf:41.75,tf:0,crit:1,order:'A',res:'QC-STATION'},
  {id:"A10",num:10,name:"Упаковка",dur:1,unit:'h',es:41.75,ef:42.75,ls:41.75,lf:42.75,tf:0,crit:1,order:'A',res:'PAINT-01'}
];
// B starts after A finishes on shared resources (leveled)
var opsB=[
  {id:"B1",num:1,name:"Подготовка",dur:4,unit:'h',es:20,ef:24,ls:20,lf:24,tf:0,crit:1,order:'B',res:'CNC-01'},
  {id:"B2",num:2,name:"Закупка",dur:8,unit:'h',es:24,ef:32,ls:24,lf:32,tf:0,crit:1,order:'B',res:'WELD-01'},
  {id:"B3",num:3,name:"Монтаж SMD",dur:8,unit:'h',es:41.25,ef:49.25,ls:41.25,lf:49.25,tf:0,crit:1,order:'B',res:'CNC-01'},
  {id:"B4",num:4,name:"Пайка",dur:6,unit:'h',es:49.25,ef:55.25,ls:49.25,lf:55.25,tf:0,crit:1,order:'B',res:'PAINT-01'},
  {id:"B5",num:5,name:"AOI",dur:0.25,unit:'h',es:55.25,ef:55.5,ls:55.25,lf:55.5,tf:0,crit:1,order:'B',res:'QC-STATION'},
  {id:"B6",num:6,name:"Функц.тест",dur:3,unit:'h',es:55.5,ef:58.5,ls:55.5,lf:58.5,tf:0,crit:1,order:'B',res:'TEST-BENCH'},
  {id:"B7",num:7,name:"Термотренир.",dur:12,unit:'h',es:58.5,ef:70.5,ls:58.5,lf:70.5,tf:0,crit:1,order:'B',res:'CNC-01'},
  {id:"B8",num:8,name:"Калибровка",dur:1,unit:'h',es:49.25,ef:50.25,ls:69.5,lf:70.5,tf:20.25,crit:0,order:'B',res:'CALIB-RIG'},
  {id:"B9",num:9,name:"Вых.контроль",dur:0.5,unit:'h',es:70.5,ef:71,ls:70.5,lf:71,tf:0,crit:1,order:'B',res:'QC-STATION'},
  {id:"B10",num:10,name:"Упаковка",dur:1,unit:'h',es:71,ef:72,ls:71,lf:72,tf:0,crit:1,order:'B',res:'PAINT-01'}
];
var opsAll=opsA.concat(opsB),omAll={};
for(var i=0;i<opsAll.length;i++)omAll[opsAll[i].id]=opsAll[i];

var depsA=[["A1","A2"],["A2","A3"],["A3","A4"],["A4","A5"],["A5","A6"],["A6","A7"],["A7","A9"],["A9","A10"],["A3","A8"],["A8","A9"]];
var depsB=[["B1","B2"],["B2","B3"],["B3","B4"],["B4","B5"],["B5","B6"],["B6","B7"],["B7","B9"],["B9","B10"],["B3","B8"],["B8","B9"]];
// Resource dependencies: A3→B1 (CNC-01 sequential), A7→B3 (CNC-01), A10→B4 (PAINT-01)
var resDeps=[["A3","B1"],["A7","B3"],["A10","B4"],["A9","B5"]];

var depsAll=depsA.concat(depsB).concat(resDeps);

// Layout: Y-per-resource + X-by-time
function makeLayout(){
  var lo={};
  for(var i=0;i<opsAll.length;i++){
    var o=opsAll[i],ri=resources.indexOf(o.res);
    lo[o.id]=[30+o.es*PX_PER_H,80+ri*80];
  }
  // Spread vertically within same column to avoid overlaps
  var ids=Object.keys(lo);
  for(var iter=0;iter<5;iter++){
    for(var i=0;i<ids.length;i++){
      for(var j=i+1;j<ids.length;j++){
        var pa=lo[ids[i]],pb=lo[ids[j]];
        var dx=Math.abs(pa[0]-pb[0]);if(dx>NODE_R*6)continue;
        var dy=pa[1]-pb[1],minDY=NODE_R*3;
        if(Math.abs(dy)<minDY){pa[1]+=(minDY-Math.abs(dy))*0.4*(dy>0?1:-1);pb[1]-=(minDY-Math.abs(dy))*0.4*(dy>0?1:-1)}
      }
    }
  }
  // Title de-overlap
  var TPAD=NODE_R+14;
  for(var iter=0;iter<5;iter++){
    for(var i=0;i<ids.length;i++){
      for(var j=i+1;j<ids.length;j++){
        var a=ids[i],b=ids[j];if(omAll[a].res===omAll[b].res)continue;
        var pa=lo[a],pb=lo[b],dx=Math.abs(pa[0]-pb[0]);if(dx>NODE_R*4)continue;
        var tY1=pa[1]-TPAD,tY2=pb[1]-TPAD;
        if(Math.abs(tY1-tY2)<12){pa[1]+=(12-Math.abs(tY1-tY2))*0.5*(pa[1]>pb[1]?1:-1);pb[1]-=(12-Math.abs(tY1-tY2))*0.5*(pa[1]>pb[1]?1:-1)}
      }
    }
  }
  return lo
}
var layout=makeLayout(),pos=clone(layout);
function clone(src){var o={};for(var k in src)o[k]=[src[k][0],src[k][1]];return o}

// Detect which edges are resource-driven
var resEdgeIds={};
for(var i=0;i<resDeps.length;i++)resEdgeIds[resDeps[i][0]+'->'+resDeps[i][1]]=true;

var scale=0.9,ox=0,oy=20,pAN=false,psx,psy,pox,poy,dragId=null,dragPos0,dragM0,hoverId=null;
var c=document.getElementById('c'),ctx=c.getContext('2d'),wrap=document.getElementById('wrap'),tip=document.getElementById('tip');

function sx(wx){return(wx+ox)*scale}function sy(wy){return(wy+oy)*scale}
function toScreenH(h){return h*PX_PER_H*scale}
function hit(cx,cy,mx,my,id){var nr=getNodeR();var rr=(nr*scale);return(mx-cx)*(mx-cx)+(my-cy)*(my-cy)<=rr*rr}
function getNodeR(){var r=NODE_R*(0.72/Math.max(scale,0.35));return Math.min(Math.max(r,18),40)}
function fmtDur(d,u){if(!d)return'-';if(u==='m')return d+'мин';if(u==='h')return d+'ч';return d+'дн'}

function draw(){
  var W=wrap.clientWidth,H=wrap.clientHeight;
  c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.fillStyle='#0A1628';ctx.fillRect(0,0,W,H);

  // Resource lane backgrounds
  for(var ri=0;ri<resources.length;ri++){
    var ly=sy(80+ri*80-40),lh=70*scale;
    ctx.fillStyle=ri%2===0?'rgba(15,30,54,0.2)':'rgba(15,30,54,0.05)';
    ctx.fillRect(0,ly,W,lh);
    ctx.fillStyle='rgba(90,112,144,0.35)';ctx.font=Math.round(9*scale)+'px "IBM Plex Mono",monospace';
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(resources[ri],8,ly+lh/2);
    // Separator
    ctx.strokeStyle='rgba(30,50,82,0.4)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(0,ly+lh);ctx.lineTo(W,ly+lh);ctx.stroke();
  }

  // Timeline grid
  var totalH=72,gStep=scale>1.2?2:scale>0.7?4:scale>0.4?8:16;
  for(var t=0;t<=totalH;t+=gStep){
    var tx=sx(30+t*PX_PER_H);if(tx<0||tx>W)continue;
    ctx.beginPath();ctx.moveTo(tx,0);ctx.lineTo(tx,H);
    ctx.strokeStyle='rgba(60,90,130,0.18)';ctx.lineWidth=0.4;ctx.stroke();
    ctx.fillStyle='rgba(176,196,222,0.5)';ctx.font=Math.round(9*scale)+'px "IBM Plex Mono",monospace';
    ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(t+'ч',tx,4);
  }

  var vs={};for(var i=0;i<opsAll.length;i++)vs[opsAll[i].id]=true;

  // Edges
  for(var i=0;i<depsAll.length;i++){
    var a=depsAll[i][0],b=depsAll[i][1];if(!vs[a]||!vs[b])continue;
    var fa=omAll[a],fb=omAll[b],pa=pos[a],pb=pos[b],ang=Math.atan2(pb[1]-pa[1],pb[0]-pa[0]),nr=getNodeR();
    var ax=pa[0]+Math.cos(ang)*nr,ay=pa[1]+Math.sin(ang)*nr,bx=pb[0]-Math.cos(ang)*nr,by=pb[1]-Math.sin(ang)*nr;
    var isRes=resEdgeIds[a+'->'+b];
    ctx.beginPath();ctx.moveTo(sx(ax),sy(ay));ctx.lineTo(sx(bx),sy(by));
    if(isRes){
      ctx.strokeStyle='rgba(245,158,11,0.28)';ctx.lineWidth=1.2;ctx.setLineDash([4,4]);
    }else{
      var both=fa.crit&&fb.crit;ctx.strokeStyle=both?'rgba(239,68,68,0.28)':(fa.order==='A'?'rgba(96,165,250,0.2)':'rgba(16,185,129,0.2)');
      ctx.lineWidth=both?1.5:1;ctx.setLineDash([]);
    }
    ctx.stroke();ctx.setLineDash([]);
    var ang2=Math.atan2(sy(by)-sy(ay),sx(bx)-sx(ax)),hl=6;
    ctx.beginPath();ctx.moveTo(sx(bx),sy(by));ctx.lineTo(sx(bx)-hl*Math.cos(ang2-0.45),sy(by)-hl*Math.sin(ang2-0.45));
    ctx.lineTo(sx(bx)-hl*Math.cos(ang2+0.45),sy(by)-hl*Math.sin(ang2+0.45));ctx.closePath();
    ctx.fillStyle=isRes?'rgba(245,158,11,0.4)':(fa.crit&&fb.crit?'rgba(239,68,68,0.35)':'rgba(96,165,250,0.25)');
    ctx.fill();
    // Duration on edge
    if(fa&&fa.dur>0){
      var midX=(ax+bx)/2,midY=(ay+by)/2,perpAng=ang+Math.PI/2,loff=10;
      var mx=midX+Math.cos(perpAng)*loff,my=midY+Math.sin(perpAng)*loff;
      ctx.save();var lbl=fmtDur(fa.dur,fa.unit);
      ctx.font='bold '+Math.round(8*scale)+'px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      var tw=ctx.measureText(lbl).width+6,th=Math.round(8*scale)+4;
      ctx.globalAlpha=0.6;ctx.fillStyle='#0A1628';ctx.beginPath();ctx.roundRect(sx(mx)-tw/2,sy(my)-th/2,tw,th,3);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle=isRes?'rgba(245,158,11,0.7)':'rgba(176,196,222,0.6)';
      ctx.fillText(lbl,sx(mx),sy(my));ctx.restore();
    }
  }

  // Nodes
  for(var i=0;i<opsAll.length;i++){
    var o=opsAll[i],cx=sx(pos[o.id][0]),cy=sy(pos[o.id][1]),nr=getNodeR(),r=nr*scale,isA=o.order==='A';
    var nFill=isA?'rgba(96,165,250,0.06)':'rgba(16,185,129,0.06)';
    var nStroke=isA?'rgba(96,165,250,0.5)':'rgba(16,185,129,0.5)';
    if(o.crit){nFill='rgba(239,68,68,0.06)';nStroke='rgba(239,68,68,0.45)'}
    ctx.beginPath();ctx.arc(cx,cy,r+2,0,2*Math.PI);ctx.fillStyle=isA?'rgba(59,130,246,0.02)':'rgba(16,185,129,0.02)';ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.fillStyle=nFill;ctx.fill();
    ctx.strokeStyle=nStroke;ctx.lineWidth=1.4;ctx.stroke();
    ctx.fillStyle=o.crit?'#E8EEF5':(isA?'rgba(176,196,222,0.7)':'rgba(16,185,129,0.7)');
    ctx.font='bold '+Math.round(11*scale)+'px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(o.order+'.'+o.num,cx,cy);
    ctx.fillStyle=isA?'rgba(96,165,250,0.65)':'rgba(16,185,129,0.65)';
    ctx.font=Math.round(9*scale)+'px Inter,system-ui';ctx.textBaseline='bottom';
    var sn=o.name;if(sn.length>12)sn=sn.slice(0,11)+'…';ctx.fillText(sn,cx,cy-r-6);
    if(!o.crit&&o.tf>0){ctx.fillStyle='#F59E0B';ctx.font=Math.round(8*scale)+'px "IBM Plex Mono",monospace';ctx.textBaseline='top';ctx.fillText('+'+parseFloat(o.tf.toFixed(1))+'ч',cx,cy+r+3)}
    // Resource badge below
    ctx.fillStyle='rgba(90,112,144,0.4)';ctx.font=Math.round(7*scale)+'px "IBM Plex Mono",monospace';ctx.textBaseline='top';
    ctx.fillText(o.res,cx,cy+r-2);
  }

  // Time markers at bottom
  var markY=sy(80+resources.length*80+10);
  for(var t=0;t<=totalH;t+=gStep){
    var tx=sx(30+t*PX_PER_H);if(tx<0||tx>W)continue;
    ctx.beginPath();ctx.moveTo(tx,markY-4);ctx.lineTo(tx,markY+4);
    ctx.strokeStyle='rgba(90,112,144,0.4)';ctx.lineWidth=0.6;ctx.stroke();
  }
}

wrap.addEventListener('mousedown',function(e){
  var rect=wrap.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  for(var i=0;i<opsAll.length;i++){var o=opsAll[i],cx=sx(pos[o.id][0]),cy=sy(pos[o.id][1]);if(hit(cx,cy,mx,my,o.id)){dragId=o.id;dragPos0=[pos[o.id][0],pos[o.id][1]];dragM0=[mx,my];return}}
  pAN=true;psx=mx;psy=my;pox=ox;poy=oy
});
window.addEventListener('mousemove',function(e){
  var rect=wrap.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  if(dragId){var dx=(mx-dragM0[0])/scale,dy=(my-dragM0[1])/scale;pos[dragId][0]=dragPos0[0]+dx;pos[dragId][1]=dragPos0[1]+dy;draw();return}
  if(pAN){ox=pox+(mx-psx)/scale;oy=poy+(my-psy)/scale;draw()}
  var found=null;
  for(var i=0;i<opsAll.length;i++){var o=opsAll[i],cx=sx(pos[o.id][0]),cy=sy(pos[o.id][1]);if(hit(cx,cy,mx,my,o.id)){found=o;break}}
  if(found&&found.id!==hoverId){hoverId=found.id;
    tip.innerHTML='<div class="tooltip-title">'+found.order+'.№'+found.num+' · '+found.name+'</div>'
      +'<div class="tooltip-row">Проект <b>'+(found.order==='A'?'СибСтройМаш':'МеталлТех')+'</b></div>'
      +'<div class="tooltip-row">Длительность <b>'+fmtDur(found.dur,found.unit)+'</b></div>'
      +'<div class="tooltip-row">Ресурс <b>'+found.res+'</b></div>'
      +'<div class="tooltip-row">Начало <b>'+parseFloat(found.es.toFixed(2))+'ч</b></div>'
      +'<div class="tooltip-row">Конец <b>'+parseFloat(found.ef.toFixed(2))+'ч</b></div>'
      +(found.tf>0?'<div class="tooltip-row">Резерв <b>+'+parseFloat(found.tf.toFixed(1))+'ч</b></div>':'')
      +'<div class="tooltip-row" style="margin-top:4px;color:'+(found.crit?'var(--danger)':'var(--fg-4)')+';">'+(found.crit?'⚠ Критический путь':'С резервом')+'</div>';
    tip.classList.add('on');
  }else if(!found&&hoverId!==null){hoverId=null;tip.classList.remove('on')}
  if(found){var cx=sx(pos[found.id][0]),cy=sy(pos[found.id][1]),nr=getNodeR(),r=nr*scale;tip.style.left=Math.min(cx+r+14,window.innerWidth-260)+'px';tip.style.top=Math.max(4,cy-80)+'px'}
});
window.addEventListener('mouseup',function(){dragId=null;pAN=false});
wrap.addEventListener('wheel',function(e){e.preventDefault();scale=Math.max(0.25,Math.min(2.5,scale*(e.deltaY<0?1.08:0.92)));draw()},{passive:false});
draw();
</script>
</body>
</html>
