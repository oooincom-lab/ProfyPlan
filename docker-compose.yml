services:
  postgres:
    image: postgres:15-alpine
    container_name: profyplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: profyplan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-profyplan}
      POSTGRES_DB: profyplan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profyplan"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: profyplan-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: profyplan-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://profyplan:${DB_PASSWORD:-profyplan}@postgres:5432/profyplan
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    ports:
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:alpine
    container_name: profyplan-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/landing.html:/usr/share/nginx/landing/landing.html:ro

volumes:
  pgdata:
  redisdata:
