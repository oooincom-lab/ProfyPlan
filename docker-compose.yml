services:
  postgres:
    image: postgres:15-alpine
    container_name: profyplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: profyplan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-profyplan}
      POSTGRES_DB: profyplan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profyplan"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: profyplan-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: profyplan-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://profyplan:${DB_PASSWORD:-profyplan}@postgres:5432/profyplan
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-profyplan.ai@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      YANDEX_DISK_TOKEN: ${YANDEX_DISK_TOKEN:-}
      YANDEX_DISK_ROOT: ${YANDEX_DISK_ROOT:-/ProfyPlan}
      YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID:-}
      YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET:-}
      YANDEX_OAUTH_SCOPE: ${YANDEX_OAUTH_SCOPE:-cloud_api:disk.read cloud_api:disk.write cloud_api:disk.info}
      GOOGLE_DRIVE_ACCESS_TOKEN: ${GOOGLE_DRIVE_ACCESS_TOKEN:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_SCOPE: ${GOOGLE_OAUTH_SCOPE:-https://www.googleapis.com/auth/drive}
      CLOUD_OAUTH_CALLBACK_URL: ${CLOUD_OAUTH_CALLBACK_URL:-https://profyplan.ru/api/v1/integration/cloud/oauth/callback}
      CLOUD_OAUTH_SUCCESS_URL: ${CLOUD_OAUTH_SUCCESS_URL:-https://profyplan.ru/workspace}
      CLOUD_OAUTH_FAILURE_URL: ${CLOUD_OAUTH_FAILURE_URL:-https://profyplan.ru/workspace}
      CLOUD_TOKEN_ENCRYPTION_KEY: ${CLOUD_TOKEN_ENCRYPTION_KEY:-}
      CLOUD_SCHEDULER_ENABLED: ${CLOUD_SCHEDULER_ENABLED:-true}
      CLOUD_SCHEDULER_INTERVAL_SECONDS: ${CLOUD_SCHEDULER_INTERVAL_SECONDS:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-profyplan.ai@gmail.com}
    ports:
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:alpine
    container_name: profyplan-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/landing.html:/usr/share/nginx/landing/landing.html:ro

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: profyplan-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  redisdata:
