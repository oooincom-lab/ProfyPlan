name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync server to this commit and rebuild
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            cd /opt/profyplan &&
            git fetch origin master &&
            git reset --hard origin/master &&
            docker compose build api web &&
            docker compose up -d api web &&
            sleep 8 &&
            curl -s -o /dev/null -w "health:%{http_code}\n" http://127.0.0.1:80/workspace
          '
