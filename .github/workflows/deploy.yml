name: Deploy to VPS
# trigger: 13.09.2026 — проверка автовыкладки

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key || true
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check connection
        env:
          SSH_HOST_S: ${{ secrets.SSH_HOST }}
          SSH_USER_S: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER_S@$SSH_HOST_S" 'echo connected: $(hostname)'

      - name: Sync and rebuild
        env:
          SSH_HOST_S: ${{ secrets.SSH_HOST }}
          SSH_USER_S: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes "$SSH_USER_S@$SSH_HOST_S" '
            set -e
            cd /opt/profyplan
            git fetch origin master
            git reset --hard origin/master

            # Перед сборкой проверяем импорты: случай, когда файл в репозитории
            # лежит в другом регистре, ломает Linux-сборку (ловушка 28.09.2026).
            sh scripts/check-imports-case.sh

            # Сборка занимает много места и кэш растёт без предела. 28.09.2026
            # кэш занял 33,7 ГБ и сборка упала из-за нехватки диска. Если свободного
            # места меньше 15 ГБ — сначала чистим кэш сборки (образы и данные не трогаем).
            avail=$(df -Pk / | awk "NR==2 {print \$4}")
            echo "свободно на диске, КБ: ${avail}"
            if [ "${avail:-0}" -lt 15000000 ]; then
              echo "мало места — очищаю кэш сборки"
              docker builder prune -f || true
              df -h / | tail -1
            fi

            docker compose build api web
            docker compose up -d --force-recreate api web
            sleep 10
            # схема базы — обязательный шаг, иначе новый код падает на новой схеме.
            # Скрипт разбирает три случая: пустая база, база прежней цепочки
            # (только отмечается, схема не меняется) и текущая цепочка.
            docker compose exec -T api python -m scripts.db_upgrade
            docker compose exec -T api alembic current
            # ОБЯЗАТЕЛЬНО: пересоздание api/web выдаёт им новые внутренние адреса.
            # Прокси держит разрешённые имена в памяти с момента запуска, поэтому
            # после пересоздания приложения и сервиса расчётов отдаёт 502 на всё
            # проксируемое. Перезапускаем прокси ПОСЛЕ пересоздания.
            docker compose restart nginx
            sleep 5
          '

      - name: Verify from outside (public address)
        run: |
          set -e
          # Проверка снаружи по публичному адресу (не изнутри сервера):
          # главная страница, рабочая область приложения, живость сервиса расчётов.
          for path in "/" "/workspace" "/api/v1/health"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://profyplan.ru${path}")
            echo "  ${path} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "FAILED: ${path} вернул ${code}"
              exit 1
            fi
          done
          echo "Проверка снаружи по публичному адресу пройдена"
