# .github/workflows/ci.yml — CI/CD Pipeline
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: profyplan
          POSTGRES_PASSWORD: test
          POSTGRES_DB: profyplan_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=app --cov-report=term
        env:
          DATABASE_URL: postgresql+asyncpg://profyplan:test@localhost:5432/profyplan_test

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
